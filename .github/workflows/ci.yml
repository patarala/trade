name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'examples/regimex/**'
      - 'tests/contracts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'examples/regimex/**'
      - 'tests/contracts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://
      JWT_SECRET: integration-test-signing-key-32-bytes
      PASSWORD_PEPPER: integration-test-pepper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Test backend
        run: python -m unittest discover -s backend/tests -t .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - name: Test frontend behavior
        run: npm --prefix frontend test
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
